name: Sync Pracc Matches

on:
  # Triggered every 15 min by cron-job.org via the GitHub API
  # Also lets you trigger it manually from GitHub UI anytime
  workflow_dispatch:

# Don't let a slow run overlap the next one
concurrency:
  group: pracc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run pracc sync
        env:
          TRACKER_URL:      ${{ secrets.TRACKER_URL }}
          TRACKER_USERNAME: ${{ secrets.TRACKER_USERNAME }}
          TRACKER_PASSWORD: ${{ secrets.TRACKER_PASSWORD }}
          PRACC_EMAIL:      ${{ secrets.PRACC_EMAIL }}
          PRACC_PASSWORD:   ${{ secrets.PRACC_PASSWORD }}
          MONTHS_AHEAD:     "2"
        run: node sync-pracc.js
