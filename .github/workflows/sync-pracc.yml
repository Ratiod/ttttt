name: Sync Pracc Matches

on:
  # Run every day at 8:00 AM UTC (adjust to your timezone)
  schedule:
    - cron: '0 8 * * *'

  # Also lets you trigger it manually from GitHub UI anytime
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pracc sync
        env:
          TRACKER_URL:      ${{ secrets.TRACKER_URL }}
          TRACKER_USERNAME: ${{ secrets.TRACKER_USERNAME }}
          TRACKER_PASSWORD: ${{ secrets.TRACKER_PASSWORD }}
          PRACC_EMAIL:      ${{ secrets.PRACC_EMAIL }}
          PRACC_PASSWORD:   ${{ secrets.PRACC_PASSWORD }}
          MONTHS_AHEAD:     "2"
        run: node sync-pracc.js

      - name: Upload screenshots (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pracc-screenshots
          path: "*.png"
          if-no-files-found: ignore
